[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-docs-crypto"
version = "1.0.0"
description = "Biblioteca de algoritmos criptográficos para o projeto SecureDocs - Missão 1"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Equipe SecureDocs", email = "project@securedocs.local"}
]
keywords = ["cryptography", "mathematics", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security :: Cryptography",
    "Topic :: Education",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=5.0",
]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["test_crypto_lib.py"]
python_files = "test_*.py"
addopts = "-v --tb=short"
